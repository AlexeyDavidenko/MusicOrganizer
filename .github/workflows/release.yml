name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  # Manual tag push: the pushed tag. Called from release-please.yml: the tag it just created.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish-binaries:
    name: Publish (${{ matrix.rid }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/MusicOrganizer.Cli/MusicOrganizer.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: Archive
        working-directory: publish/${{ matrix.rid }}
        run: |
          NAME=musicorganizer-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            zip -r "../../$NAME.zip" .
          else
            tar -czf "../../$NAME.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicorganizer-${{ matrix.rid }}
          path: musicorganizer-${{ steps.version.outputs.version }}-${{ matrix.rid }}.*
          retention-days: 7

  docker:
    name: Docker build & push
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build image tags
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "tags=${IMAGE,,}:latest,${IMAGE,,}:${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    name: Create GitHub Release
    needs: publish-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # release-please has already created the release (with its CHANGELOG section as notes) by
      # the time this runs; a manually pushed tag has no release yet. Create only if missing, then
      # attach the binaries either way.
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber
